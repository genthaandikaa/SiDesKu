<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Ilustrasi layanan surat desa digital">
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- bayangan tanah -->
  <ellipse cx="280" cy="350" rx="240" ry="16" fill="#1e3a8a" opacity="0.10"/>

  <!-- ===== BALAI DESA ===== -->
  <g>
    <!-- tiang bendera -->
    <rect x="159" y="86" width="3" height="44" fill="#64748b"/>
    <rect x="162" y="88" width="26" height="8" fill="#ef4444"/>
    <rect x="162" y="96" width="26" height="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- atap atas -->
    <polygon points="118,160 160,128 202,160" fill="#1d4ed8"/>
    <!-- atap bawah -->
    <polygon points="34,222 160,152 286,222" fill="url(#roof)"/>
    <polygon points="34,222 286,222 280,230 40,230" fill="#1e40af"/>

    <!-- dinding -->
    <rect x="60" y="230" width="200" height="80" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <!-- tiang -->
    <rect x="66" y="230" width="12" height="80" fill="#93c5fd"/>
    <rect x="242" y="230" width="12" height="80" fill="#93c5fd"/>
    <rect x="104" y="230" width="8" height="80" fill="#bfdbfe"/>
    <rect x="208" y="230" width="8" height="80" fill="#bfdbfe"/>
    <!-- pintu -->
    <path d="M140 310 V262 a20 20 0 0 1 40 0 V310 Z" fill="#2563eb"/>
    <path d="M160 242 V310" stroke="#1e40af" stroke-width="2"/>
    <!-- jendela -->
    <rect x="84" y="254" width="26" height="30" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="210" y="254" width="26" height="30" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <!-- lambang di atap -->
    <circle cx="160" cy="196" r="12" fill="#ffffff"/>
    <path d="M160 187 l8 3 v7 c0 5 -4 8 -8 10 c-4 -2 -8 -5 -8 -10 v-7 z" fill="#2563eb"/>
    <!-- pelataran -->
    <rect x="40" y="310" width="240" height="14" rx="3" fill="#bfdbfe"/>
    <rect x="28" y="322" width="264" height="10" rx="3" fill="#93c5fd"/>
  </g>

  <!-- ===== TANAMAN ===== -->
  <g>
    <path d="M300 332 c-6 -22 -2 -40 12 -52 c8 18 4 38 -12 52 z" fill="#34d399"/>
    <path d="M300 332 c-18 -12 -26 -28 -22 -46 c16 8 26 26 22 46 z" fill="#10b981"/>
    <rect x="288" y="328" width="26" height="14" rx="4" fill="#f59e0b"/>
  </g>

  <!-- ===== SURAT / DOKUMEN ===== -->
  <g transform="translate(245 38) rotate(-3 105 135)" filter="url(#shadow)">
    <rect width="210" height="272" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <!-- kop surat -->
    <circle cx="34" cy="36" r="16" fill="#2563eb"/>
    <path d="M34 26 l9 3 v8 c0 6 -4 9 -9 11 c-5 -2 -9 -5 -9 -11 v-8 z" fill="#ffffff"/>
    <rect x="58" y="26" width="100" height="8" rx="4" fill="#1e3a8a"/>
    <rect x="58" y="40" width="70" height="6" rx="3" fill="#93c5fd"/>
    <rect x="18" y="62" width="174" height="2" fill="#bfdbfe"/>
    <!-- judul -->
    <rect x="50" y="76" width="110" height="9" rx="4.5" fill="#2563eb"/>
    <!-- baris isi -->
    <rect x="20" y="98" width="170" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="20" y="112" width="150" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="20" y="126" width="165" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="20" y="140" width="120" height="6" rx="3" fill="#e2e8f0"/>

    <!-- QR code -->
    <g transform="translate(20 172)">
      <rect x="-6" y="-6" width="76" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <g transform="scale(7)" fill="#1e3a8a">
        <rect x="0" y="0" width="3" height="3"/>
        <rect x="6" y="0" width="3" height="3"/>
        <rect x="0" y="6" width="3" height="3"/>
        <g fill="#eff6ff">
          <rect x="0.6" y="0.6" width="1.8" height="1.8"/>
          <rect x="6.6" y="0.6" width="1.8" height="1.8"/>
          <rect x="0.6" y="6.6" width="1.8" height="1.8"/>
        </g>
        <rect x="1" y="1" width="1" height="1"/>
        <rect x="7" y="1" width="1" height="1"/>
        <rect x="1" y="7" width="1" height="1"/>
        <path d="M3 0h1v1h-1z M4 1h1v1h-1z M5 0h1v1h-1z M3 2h1v1h-1z M4 3h1v1h-1z M0 3h1v1h-1z M2 4h1v1h-1z M1 5h1v1h-1z M3 5h1v1h-1z M5 4h1v1h-1z M6 3h1v1h-1z M8 4h1v1h-1z M7 5h1v1h-1z M4 6h1v1h-1z M5 7h1v1h-1z M3 8h1v1h-1z M6 6h1v1h-1z M8 7h1v1h-1z M7 8h1v1h-1z M4 8h1v1h-1z M8 3h1v1h-1z"/>
      </g>
    </g>

    <!-- tanda tangan -->
    <rect x="112" y="186" width="80" height="6" rx="3" fill="#e2e8f0"/>
    <path d="M114 226 c8 -22 14 -22 16 -6 c2 12 8 -2 14 -10 c4 -6 8 6 14 6 c8 0 10 -12 20 -8" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="236" width="70" height="5" rx="2.5" fill="#bfdbfe"/>

    <!-- stempel sah -->
    <g transform="translate(150 206)">
      <circle r="26" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
      <circle r="17" fill="#2563eb"/>
      <path d="M-8 0 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== HP ===== -->
  <g transform="translate(432 150)" filter="url(#shadow)">
    <rect width="100" height="190" rx="18" fill="url(#phone)"/>
    <rect x="6" y="6" width="88" height="178" rx="13" fill="url(#screen)"/>
    <rect x="36" y="11" width="28" height="6" rx="3" fill="#1e3a8a"/>
    <!-- centang -->
    <circle cx="50" cy="62" r="22" fill="#22c55e"/>
    <path d="M40 62 l8 8 l14 -16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- teks dummy -->
    <rect x="22" y="100" width="56" height="7" rx="3.5" fill="#1e3a8a"/>
    <rect x="28" y="114" width="44" height="5" rx="2.5" fill="#93c5fd"/>
    <!-- kartu status -->
    <rect x="16" y="132" width="68" height="34" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
    <circle cx="32" cy="149" r="7" fill="#dbeafe"/>
    <rect x="44" y="144" width="30" height="5" rx="2.5" fill="#2563eb"/>
    <rect x="44" y="153" width="20" height="4" rx="2" fill="#bfdbfe"/>
  </g>

  <!-- ===== DEKORASI ===== -->
  <g fill="#60a5fa">
    <circle cx="48" cy="120" r="5" opacity="0.5"/>
    <circle cx="520" cy="96" r="4" opacity="0.5"/>
    <circle cx="236" cy="22" r="3" opacity="0.6"/>
    <path d="M500 52 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" opacity="0.6"/>
    <path d="M56 70 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 z" opacity="0.5"/>
  </g>
</svg>
